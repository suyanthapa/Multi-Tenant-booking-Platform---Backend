MessageResponse:
  description: Operation successful
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/MessageData"

RegisterResponse:
  description: Registration successful
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Registration successful. Please verify your email to activate your account.
          data:
            type: object
            properties:
              user:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                    format: email
                  username:
                    type: string
                  role:
                    type: string
                    example: CUSTOMER
                  status:
                    type: string
                    example: PENDING_VERIFICATION
              message:
                type: string
                example: Registration successful. Please check your email for verification code.

VerifyEmailResponse:
  description: Email verified successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Email verified successfully
          data:
            type: object
            properties:
              message:
                type: string
                example: Email verified successfully. You can now log in.

VerifyOtpResponse:
  description: OTP verified successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: OTP verified successfully. Email confirmed.
          data:
            type: object
            properties:
              resetToken:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

ResendVerificationResponse:
  description: Verification OTP resent successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Verification code has been resent to your email.
          data:
            nullable: true
            example: null

RefreshTokenResponse:
  description: Token refreshed successfully
  headers:
    Set-Cookie:
      description: HTTP-only access and refresh token cookies are rotated.
      schema:
        type: string
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Token refreshed successfully
          data:
            nullable: true
            example: null

LogoutResponse:
  description: Logout successful
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Logout successful
          data:
            nullable: true
            example: null

LoginResponse:
  description: Login successful
  headers:
    Set-Cookie:
      description: HTTP-only access and refresh token cookies are set.
      schema:
        type: string
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Login successful
          data:
            $ref: "#/components/schemas/LoginData"

ForgotPasswordResponse:
  description: Request accepted (same response whether email exists or not)
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: If the email exists, a password reset code has been sent.
          data:
            nullable: true
            example: null

ResetPasswordResponse:
  description: Password reset successful
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Password reset successfully. Please log in with your new password.
          data:
            nullable: true
            example: null

UserProfileResponse:
  description: Profile fetched successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Success
          data:
            $ref: "#/components/schemas/UserProfile"
