RegisterInput:
  type: object
  required: [username, email, password]
  properties:
    username:
      type: string
      example: suyan_thapa
    email:
      type: string
      format: email
      example: suyan@example.com
    password:
      type: string
      format: password
      minLength: 8
      example: secret1234

LoginInput:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      example: john@example.com
    password:
      type: string
      format: password
      example: secret1234

VerifyEmailInput:
  type: object
  required: [email, otp, purpose]
  properties:
    email:
      type: string
      format: email
      example: john@example.com
    otp:
      type: string
      example: "123456"
    purpose:
      type: string
      enum: [EMAIL_VERIFICATION, PASSWORD_RESET]
      example: EMAIL_VERIFICATION

VerifyOtpInput:
  type: object
  required: [email, otp]
  properties:
    email:
      type: string
      format: email
      example: john@example.com
    otp:
      type: string
      example: "123456"

ResendVerificationOTPInput:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      example: john@example.com

ForgotPasswordInput:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      example: john@example.com

ResetPasswordInput:
  type: object
  required: [email, otp, newPassword]
  properties:
    email:
      type: string
      format: email
      example: john@example.com
    otp:
      type: string
      example: "123456"
    newPassword:
      type: string
      format: password
      minLength: 8
      example: newSecret1234

AuthUser:
  type: object
  properties:
    id:
      type: string
      example: clx1234abcd
    email:
      type: string
      format: email
    username:
      type: string
      example: johndoe
    role:
      type: string
      example: OWNER
    status:
      type: string
      example: ACTIVE

LoginData:
  type: object
  properties:
    user:
      $ref: "#/components/schemas/AuthUser"
    accessToken:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

MessageData:
  type: object
  properties:
    message:
      type: string
      example: Operation successful

ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: Invalid email or password
    error:
      type: object
      properties:
        code:
          type: string
          example: AUTHENTICATION_ERROR

UserProfile:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
    email:
      type: string
      format: email
    createdAt:
      type: string
      format: date-time

EditUserInput:
  type: object
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 30
      example: john_updated
    firstName:
      type: string
      maxLength: 50
      example: John
    lastName:
      type: string
      maxLength: 50
      example: Doe

UserEntity:
  type: object
  properties:
    id:
      type: string
    username:
      type: string
    firstName:
      type: string
      nullable: true
    lastName:
      type: string
      nullable: true
    email:
      type: string
      format: email
    phone:
      type: string
      nullable: true
    role:
      type: string
      enum: [CUSTOMER, VENDOR, ADMIN]
    status:
      type: string
      enum: [ACTIVE, PENDING_VERIFICATION, DELETED, SUSPENDED]
    isEmailVerified:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    lastLoginAt:
      type: string
      format: date-time
      nullable: true

PaginatedUsers:
  type: object
  properties:
    users:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            example: clx1234abcd
          username:
            type: string
            example: suyan_thapa
          firstName:
            type: string
            example: Suyan
          lastName:
            type: string
            example: Thapa
          email:
            type: string
            format: email
            example: suyan@example.com
          role:
            type: string
            example: CUSTOMER
          status:
            type: string
          isEmailVerified:
            type: boolean
            example: true
          createdAt:
            type: string
            format: date-time
            example: "2026-02-26T04:15:20.526Z"
          updatedAt:
            type: string
            format: date-time
            example: "2026-03-09T08:50:46.392Z"
          lastLoginAt:
            type: string
            format: date-time
            example: "2026-03-10T10:20:30.123Z"
    meta:
      type: object
      properties:
        total:
          type: integer
          example: 1
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 1
