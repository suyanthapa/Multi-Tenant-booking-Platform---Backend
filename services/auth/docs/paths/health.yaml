/health:
  get:
    tags: [Health]
    summary: Health check
    description: Returns service health status including database connectivity
    responses:
      "200":
        description: Service is healthy
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
                service:
                  type: string
                  example: auth-service
                timestamp:
                  type: string
                  format: date-time
                uptime:
                  type: number
                  example: 123.45
                database:
                  type: string
                  example: connected
      "503":
        description: Service is unhealthy
