/api/auth/register:
  post:
    tags: [Auth]
    summary: Register a new user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterInput"
    responses:
      "201":
        description: Registration successful
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Registration successful. Please verify your email to activate your account.
                data:
                  type: object
                  properties:
                    user:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                          format: email
                        username:
                          type: string
                        role:
                          type: string
                          example: CUSTOMER
                        status:
                          type: string
                          example: PENDING_VERIFICATION
                    message:
                      type: string
                      example: Registration successful. Please check your email for verification code.
      "400":
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              success: false
              message: Validation failed
              error:
                code: VALIDATION_ERROR
                errors:
                  - field: email
                    message: Invalid email format
                  - field: password
                    message: Must be at least 8 characters
      "409":
        description: Email or username already exists
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              EmailAlreadyRegistered:
                value:
                  success: false
                  message: Email already registered
                  error:
                    code: CONFLICT_ERROR
              UsernameAlreadyTaken:
                value:
                  success: false
                  message: Username already taken
                  error:
                    code: CONFLICT_ERROR

/api/auth/login:
  post:
    tags: [Auth]
    summary: Login user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginInput"
    responses:
      "200":
        $ref: "#/components/responses/LoginResponse"
      "400":
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              success: false
              message: Validation failed
              error:
                code: VALIDATION_ERROR
                errors:
                  - field: email
                    message: Required
                  - field: password
                    message: Must be at least 8 characters
      "401":
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              InvalidCredentials:
                value:
                  success: false
                  message: Invalid email or password
                  error:
                    code: AUTHENTICATION_ERROR
              AccountInactive:
                value:
                  success: false
                  message: Account is inactive
                  error:
                    code: AUTHENTICATION_ERROR
      "403":
        description: Access denied
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              EmailNotVerified:
                value:
                  success: false
                  message: Email not verified. A new verification code has been sent.
                  error:
                    code: EMAIL_NOT_VERIFIED
              AccountPending:
                value:
                  success: false
                  message: Your business account is pending admin approval.
                  error:
                    code: ACCOUNT_PENDING
              AccountSuspended:
                value:
                  success: false
                  message: Your business account has been suspended.
                  error:
                    code: ACCOUNT_SUSPENDED

/api/auth/forgot-password:
  post:
    tags: [Auth]
    summary: Request password reset OTP
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForgotPasswordInput"
    responses:
      "200":
        description: Request accepted (same response whether email exists or not)
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: If the email exists, a password reset code has been sent.
                data:
                  nullable: true
                  example: null
      "400":
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              success: false
              message: Validation failed
              error:
                code: VALIDATION_ERROR
                errors:
                  - field: email
                    message: Required

/api/auth/reset-password:
  post:
    tags: [Auth]
    summary: Reset password using OTP
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResetPasswordInput"
    responses:
      "200":
        description: Password reset successful
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageResponse"
      "400":
        description: Invalid or expired OTP

/api/auth/me:
  get:
    tags: [Auth]
    summary: Get current user profile
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Profile fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfile"
      "401":
        description: Unauthorized
